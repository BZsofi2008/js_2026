<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gyakorlas</title>
</head>
<body onload="feladat1(); feladat2(); feladat3(); feladat100(); feladat4(); maradek()">
    <div id="feladat1"></div>
    <div id="feladat2"></div>
    <div id="feladat100"></div>
    <div id="feladat3"></div>
    <div id="feladat4"></div>
    <div id="szam0"><h2>0</h2></div>
    <div id="szam1"><h2>1</h2></div>
    <div id="szam2"><h2>2</h2></div>
    <div id="szam3"><h2>3</h2></div>
    <div id="szam4"><h2>4</h2></div>
    <div id="szam5"><h2>5</h2></div>
    <div id="szam6"><h2>6</h2></div>



    <script>
        function feladat1()
        {
            let doboz=document.getElementById("feladat1");

            for(let szam=0;szam<10;szam++)
            {
                doboz.innerHTML+=szam + " ";
            }

        }

        function feladat100()
        {
            let doboz=document.getElementById("feladat100");

            for(let i=0;i<=100;i++)
            {
                doboz.innerHTML+=i + " ";
            }

        }

        function feladat2()
        {
            let vissza = document.getElementById("feladat2");

            for(let i=10;i>=0;i--)
            {
                vissza.innerHTML+=i + " ";
            }
        }

        function feladat3()
        {
            let masodik = document.getElementById("feladat3");

            for(let valami=0;valami<=10;valami++)
            {
                masodik.innerHTML+=valami + " ";
            }
        }

        function feladat4()
        {
            let doboz = document.getElementById("feladat4")
            for(let i=0;i<=1000;i+=5)
        {
            doboz.innerHTML+=i + " ";
        }
        }

        function maradek()
        {
            for(let i=0;i<=100;i++)
            {
                let maradek = i % 7;
                document.getElementById("szam" + maradek).innerHTML += i+" ";
            }

        }
        
    </script>
</body>

1000 alatti 5-tel oszthato szamok

         - h2 0 1 2 3

            - 4-gyel osztva mennyi a maradeka

                            - div megszerzese amibe irni akarok (a maradekosok)

                                                doc.getelementbyid(szam+maradek.innerhtml i % 4)

-->
</html>
