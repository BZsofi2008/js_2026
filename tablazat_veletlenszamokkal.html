<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Random számok 100-ig</h3> <br>
    <div><span id="leg_kisebb"></span></div>    <br>
    <div><span id="leg_nagyobb"></span></div>   <br>
    <div><span id="atlag"></span></div>        <br>

    <table id="tabla">

    </table>

    <script>
        function random()
        {
            // console.log("mukodik");
            return Math.floor(Math.random() * 100);
        }

        const szamok = [];

        for(let i=0;i<20;i++)
        {
            szamok.push(random())
        }

        for(let i=0;i<szamok.length;i++)
        {
            console.log(szamok[i]);

            let tablazat = "<tr> <td>" +szamok[i]+ "</td> </tr>"
            document.getElementById("tabla").innerHTML += tablazat;
        }

        console.log(szamok);

        //szelsoertek kereses, maximum

        let legnagyobb = -1; //max szam keresese
        for(let i=0; i<szamok.length; i++)
        {
            if(szamok[i]>legnagyobb)
            {
                legnagyobb = szamok[i];
            }
        }
        document.getElementById("leg_nagyobb").innerHTML = "A legnagyobb szám: " + legnagyobb;

        let legkisebb = 100; //minimum szam keresese
        for(let i=0; i<szamok.length; i++)
        {
            if(szamok[i]<legkisebb)
            {
                legkisebb = szamok[i];
            }
        }
        document.getElementById("leg_kisebb").innerHTML = "A legkisebb szám: " + legkisebb;

        let osszeg = 0;
        for(i=0; i<szamok.length; i++)
        {
            osszeg += szamok[i] / szamok.length;
        }
        document.getElementById("atlag").innerHTML = "Az átlag: " + osszeg;

        const parosok = [];
        
    </script>
</body>
</html>
