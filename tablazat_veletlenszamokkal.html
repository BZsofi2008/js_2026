<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Random számok 100-ig</h3>
    <table id="tabla">

    </table>

    <script>
        function random()
        {
            // console.log("mukodik");
            return Math.floor(Math.random() * 100);
        }

        const szamok = [];

        for(let i=0;i<20;i++)
        {
            szamok.push(random())
        }

        for(let i=0;i<szamok.length;i++)
        {
            console.log(szamok[i]);

            let tablazat = "<tr> <td>" +random()+ "</td> </tr>"
            document.getElementById("tabla").innerHTML += tablazat;
        }

        console.log(szamok);
    </script>
</body>
</html>
