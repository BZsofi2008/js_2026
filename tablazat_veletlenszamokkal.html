<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Random számok 100-ig</h3> <br>
    <div><span id="leg_kisebb"></span></div>    <br>
    <div><span id="leg_nagyobb"></span></div>   <br>
    <div><span id="atlag"></span></div>        <br>


    <div id="sok_tabla" style="display: flex; gap: 20px; align-items: start;">
        <div>
            <h2>Random számok</h2>
            <table id="tabla" style="border: 1px solid black;">
            </table>
        </div>

        <div>
            <h2>Páros számok</h2>
            <table id="tabla_masik" style="border: 1px solid black;">
            </table>
        </div>

        <div>
            <h2>Páratlan számok</h2>
            <table id="tabla_paratlan" style="border: 1px solid black;">
            </table>
        </div>

        <div>
            <h2>7-tel osztható számok</h2>
            <table id="tabla_hetes" style="border: 1px solid black;">
            </table>
        </div>

        <div>
            <h2>vmi random</h2>
            <table id="tabla_megegy" style="border: 1px solid black;">
            </table>
        </div>
    </div>


    <script>
        function random()
        {
            // console.log("mukodik");
            return Math.floor(Math.random() * 100);
        }

        const szamok = [];

        for(let i=0;i<20;i++)
        {
            szamok.push(random())
        }

        for(let i=0;i<szamok.length;i++)
        {
            console.log(szamok[i]);

            let tablazat = "<tr> <td>" +szamok[i]+ "</td> </tr>"
            document.getElementById("tabla").innerHTML += tablazat;
        }

        console.log(szamok);

        //szelsoertek kereses, maximum

        let legnagyobb = -1; //max szam keresese
        for(let i=0; i<szamok.length; i++)
        {
            if(szamok[i]>legnagyobb)
            {
                legnagyobb = szamok[i];
            }
        }
        document.getElementById("leg_nagyobb").innerHTML = "A legnagyobb szám: " + legnagyobb;

        let legkisebb = 100; //minimum szam keresese
        for(let i=0; i<szamok.length; i++)
        {
            if(szamok[i]<legkisebb)
            {
                legkisebb = szamok[i];
            }
        }
        document.getElementById("leg_kisebb").innerHTML = "A legkisebb szám: " + legkisebb;

        let osszeg = 0;
        for(i=0; i<szamok.length; i++)
        {
            osszeg += szamok[i] / szamok.length;
        }
        document.getElementById("atlag").innerHTML = "Az átlag: " + osszeg;

        const parosok = []; //paros szamok ki irasa
        const paratlan = []; //paratlanok
        for(let i=0; i<szamok.length; i++)
        {
            if(szamok[i] % 2 == 0)
            {
            parosok.push(szamok[i])
            }
            else
            {
                if(szamok[i] % 2 !== 0)
                paratlan.push(szamok[i])
            }
        }

        for(let i=0;i<parosok.length;i++)
        {
            console.log(parosok[i]);

            let tablazat2 = "<tr> <td>" +parosok[i]+ "</td> </tr>"
            document.getElementById("tabla_masik").innerHTML += tablazat2;
        }
        for(let i=0;i<paratlan.length;i++)
        {
            console.log(paratlan[i]);

            let tablazat3 = "<tr> <td>" +paratlan[i]+ "</td> </tr>"
            document.getElementById("tabla_paratlan").innerHTML += tablazat3;
        }

        const hetesek = []; //hettel oszthato
        for(let i=0; i<szamok.length; i++)
        {
            if(szamok[i] % 7 == 0)
            {
            hetesek.push(szamok[i])
            }
        }
        for(let i=0;i<hetesek.length;i++)
        {
            console.log(hetesek[i]);

            let tablazat4 = "<tr> <td>" +hetesek[i]+ "</td> </tr>"
            document.getElementById("tabla_hetes").innerHTML += tablazat4;
        }

        /* szamok.sort((a, b) => b-a); // tomb rendezes - callback fuggveny. Ez modosit vmit (idk)
        console.log(szamok); */

        let rendezett = szamok.toSorted((a,b) => a-b);
        console.log(rendezett);
        for(let i=0; i<rendezett.length; i++)
        {
            let tablazatMegEgy = "<tr> <td>" +rendezett[i]+ "</td> </tr>"
            document.getElementById("tabla_megegy").innerHTML += tablazatMegEgy;
        }

    </script>
</body>
</html>

<!-- tablazat alatt vmilyen modon jelenjen meg a legkisebb, legangyobb szam meg az atlag -->
 <!-- h2 tablazatok elott Random számok, Páros számok -->
