<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="szam"></label>
    <input type="number" id="szam">
    <button type="button" onclick="szamolas()">gomb</button>

    <div id="ujGomb"></div>

    <script>
        function szamolas()
        {
            let sz = document.getElementById("szam").value;
            sz = parseInt(sz);
            console.log(sz);

            for(let i=0;i<sz;i++)
            {
                console.log(i)

                let doboz = document.getElementById("ujGomb");
                doboz.innerHTML += '<button type="button">gomb</button>' + "asd"; 
                console.log(doboz+"asd")
            }



        }
    </script>
</body>
</html>

<!--program ami beker 1 szamot, majd a szam bekerese utan annyi gombot megjelenit a weboldalban amennyi a szam volt. 
            A gomb felirata legyen az h "gomb". 
            extra: a gomb benyomasakor jelenjen meg a consoleban h hanyadik gomb.-->
