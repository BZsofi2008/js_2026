<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teglalap</title>
</head>

<body onload="teglalap()">
    <label for="szam">szám: </label>
    <input type="number" id="szam">
    <button type="button" onclick="teglalap()">küld</button><br><br>

    <!-- <div id="megjelenites" style=" width: 75px; height: 50px; background-color: lightblue; border: 1px solid black;"></div> -->
    <div id="alap"></div>

    <script>
        function teglalap()
        {
            let sz = document.getElementById("szam").value;
            sz = parseInt(sz);
            console.log(sz);

            for(let i=0;i<=sz;i++)
                {
                    var div = document.createElement("div");
                    div.style.width = "75px";
                    div.style.height = "50px";
                    div.style.background = "lightblue";
                    div.style.border = "solid black";
                    div.style.borderRadius = "1px";
                    document.getElementById("alap").appendChild(div);
                }


            /* tlap.innerHTML = szam;
            document.body.appendChild(tlap) */
            
            
            /* sz.innerText = sz;
            console.log(sz);

            document.body.appendChild(sz); */
        }
    </script>
</body>
</html>
