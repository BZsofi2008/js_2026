<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" onclick="timestamp()">Kattintgatás ide</button>

    <div id="uzenet"></div>

    <ul id="lista"></ul>

    <script>
        const idok = [];
        let utolsoIdo = 0;
        
        function timestamp()
        {
            console.log("asdasdas");

            const d = new Date();
            document.getElementById("uzenet").innerHTML = d.getTime();

            idok.push(d.getTime() - utolsoIdo);
            console.log(idok);

            let lista = document.getElementById("lista");
            lista.innerHTML = " ";
            // a = "szo" + a;

            for(let i=0;i<idok.length;i++)
                {
                    document.getElementById("lista").innerHTML = "<li>" + idok[i] + "</li>" + document.getElementById("lista").innerHTML;
                }

            utolsoIdo = d.getTime();
        }
    </script>
</body>
</html>
