<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="szam1">Első szám</label> 
    <input type="number" id="szam1"> <br><br>

    <label for="szam2">Második szám</label>
    <input type="number" id="szam2"> <br><br>

    <button type="button" onclick="szorzatok()">küld</button>

    <ul id="lista"></ul>
    <script>
        function szorzatok()
        {
            let sz1 = parseInt(document.getElementById("szam1").value);
            let sz2 = parseInt(document.getElementById("szam2").value);
            console.log(sz1, sz2);

            let lista = document.getElementById("lista");

            lista.innerHTML = " ";

            for(let i=0;i<=sz1*sz2;i++)
            {
                lista.innerHTML += "<li>" + i + "</li>";
            }
        }
    </script>
</body>
</html>

<!-- 3 szam bekeres. Listaban megjeleniteni a szamokat 0-tol a ket szam szorzataig-->
