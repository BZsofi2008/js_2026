<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" onclick="random()">Katt ide</button>

    <table id="doboz">

    </table>


    <script>

        function random()
        {
            // console.log("mukodik");
            return Math.floor(Math.random() * 101);
        }

        const szamok = [];
        for(let i=0;i<20;i++)
        {
            szamok.push(random())
            console.log(szamok);

            let tablazat = "<tr> <th> "+i+". </th> <td> "+random()+" </td> </tr>"
            document.getElementById("doboz").innerHTML += tablazat;
        }
    </script>
</body>
</html>

     tablazatkent lehgyen megjelenitve-->
