<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h1>Lottószámok</h1> <br><br>
    <table>
        <thead>
            <th>A hét száma</th>
            <th>Első szám</th>
            <th>Második szám</th>
            <th>Harmadik szám</th>
            <th>Negyedik szám</th>
            <th>Ötödik szám</th>
            <th>Hatodik szám</th>
        </thead>
        <tbody id="doboz">
 
        </tbody>
    </table>

    <script>
        function lotto(){
            return Math.floor(Math.random() * 45) +1; 
        }

        for(let i=1;i<=52;i++)
            {
                let sor = "<tr> <th> "+i+". </th> <td> "+lotto()+" </td> <td> "+lotto()+" </td> <td> "+lotto()+" </td> <td> "+lotto()+" </td> <td> "+lotto()+" </td> <td> "+lotto()+" </td> </tr>"
                document.getElementById("doboz").innerHTML += sor; 

            }
    </script>
</body>
</html>
