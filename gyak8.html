<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="honapok">hónapok: </div>
    <div id="honapok2"></div>
    <ul id="lista"></ul>

    <script>
        const tomb = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];
        console.log(tomb)

        for(let i=0;i<=tomb.length;i++)
            {
                console.log(tomb[i]);
            }

        document.getElementById("honapok").innerHTML = tomb;

        document.getElementById("honapok2").innerHTML = tomb.join(" ");    


        for(let i=0;i<=tomb.length;i++)
            {
                document.getElementById("lista").innerHTML += "<li>" + tomb[i] + "</li>" ;
            }
        
    </script>
</body>
</html>
